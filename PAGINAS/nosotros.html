<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Otay Artist</title>

    <link rel="icon" type="image/png" href="../IMAGENES/logootay_header.png">


    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="../styles.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>

</head>

<body>
    <header>
        <nav class="navbar navbar-expand-lg titulo sticky-top">
            <div class="container-fluid max-width-1200 px-lg-4">
                <a class="navbar-brand logo-link" href="../index.html">
                    <img src="../IMAGENES/logootay_header.png" alt="Otay Artist" class="logo-header">
                </a>

                <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse"
                    data-bs-target="#menuOtay" aria-controls="menuOtay" aria-expanded="false"
                    aria-label="Abrir navegación">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <div class="collapse navbar-collapse" id="menuOtay">
                    <ul class="navbar-nav ms-auto mb-2 mb-lg-0 align-items-lg-center gap-lg-4">
                        <li class="nav-item">
                            <a class="nav-link nav-link-otay active" href="../index.html">Inicio</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link nav-link-otay" href="productos.html">Productos</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link nav-link-otay" href="nosotros.html">Nosotros</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link nav-link-otay" href="contacto.html">Contacto</a>
                        </li>
                    </ul>

                </div>
            </div>
        </nav>

        <!--slider-->
        <div id="sliderPortada" class="carousel slide carousel-fade position-relative" data-bs-ride="carousel"
            data-bs-interval="4500">

            <div class="carousel-indicators">
                <button type="button" data-bs-target="#sliderPortada" data-bs-slide-to="0" class="active"
                    aria-current="true" aria-label="Imagen 1"></button>
                <button type="button" data-bs-target="#sliderPortada" data-bs-slide-to="1"
                    aria-label="Imagen 2"></button>
                <button type="button" data-bs-target="#sliderPortada" data-bs-slide-to="2"
                    aria-label="Imagen 3"></button>
                <button type="button" data-bs-target="#sliderPortada" data-bs-slide-to="3"
                    aria-label="Imagen 4"></button>
                <button type="button" data-bs-target="#sliderPortada" data-bs-slide-to="4"
                    aria-label="Imagen 5"></button>
            </div>



            <div class="carousel-inner">
                <!-- portada 1 -->
                <div class="carousel-item active">
                    <img src="../IMAGENES/slidernosotros1.jpg" class="d-block w-100" alt="Slider 1" height="462px"
                        alt="Vive el arte con nosotros - Otay Artist" data-bs-interval="1000">
                </div>

                <!-- portada 2-->
                <div class="carousel-item">
                    <img src="../IMAGENES/slidernosotros2.jpg" class="d-block w-100" alt="Slider 2" height="462px">
                </div>

                <!--portada 3-->
                <div class="carousel-item">
                    <img src="../IMAGENES/slidernosotros3.jpg" class="d-block w-100" alt="Slider 3" height="462px">
                </div>

                <!-- portada 4 -->
                <div class="carousel-item">
                    <img src="../IMAGENES/slidernosotros4.jpg" class="d-block w-100" alt="Slider 4" height="462px">
                </div>

                <!--portada 5-->
                <div class="carousel-item">
                    <img src="../IMAGENES/slidernosotros5.jpg" class="d-block w-100" alt="Slider 5" height="462px">
                </div>
            </div>

            <button class="carousel-control-prev" type="button" data-bs-target="#sliderPortada" data-bs-slide="prev">
                <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                <span class="visually-hidden">Anterior</span>
            </button>
            <button class="carousel-control-next" type="button" data-bs-target="#sliderPortada" data-bs-slide="next">
                <span class="carousel-control-next-icon" aria-hidden="true"></span>
                <span class="visually-hidden">Siguiente</span>
            </button>
        </div>
    </header>
