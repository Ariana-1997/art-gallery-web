<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión | Otay Artist</title>
    <link rel="icon" type="image/png" href="../IMAGENES/logootay_header.png">
    <link rel="stylesheet" href="../styles.css">
    <script>
        // Si ya hay sesión activa, ir directo al panel.
        if (localStorage.getItem("usuario")) window.location.replace("admin.html");
    </script>
</head>

<body class="pagina-login">
    <!-- Fondo: una obra de la galería, difuminada -->
    <div class="login-fondo" aria-hidden="true"></div>

    <a class="login-volver" href="../index.html">← Volver a la galería</a>

    <main class="login-centro">
        <section class="login-tarjeta">
            <a href="../index.html" class="login-logo">
                <img src="../IMAGENES/logootay_header.png" alt="Otay Artist">
            </a>

            <h1>¡Hola de nuevo!</h1>
            <p class="login-subtitulo">Ingresa para gestionar el catálogo de la galería.</p>

            <form class="login-formulario" onsubmit="login(event)" novalidate>
                <div class="login-campo">
                    <label for="username">Usuario</label>
                    <input type="text" id="username" name="username" autocomplete="username"
                        placeholder="Tu usuario" required autofocus>
                </div>

                <div class="login-campo">
                    <label for="password">Contraseña</label>
                    <div class="login-password">
                        <input type="password" id="password" name="password" autocomplete="current-password"
                            placeholder="Tu contraseña" required>
                        <button type="button" class="login-ver" id="ver-password"
                            aria-label="Mostrar contraseña" aria-pressed="false">ver</button>
                    </div>
                </div>

                <p id="error" class="login-error" role="alert" aria-live="assertive"></p>

                <button type="submit" class="login-boton">Entrar</button>
            </form>

            <p class="login-nota">Espacio solo para el equipo de Otay Artist</p>
        </section>
    </main>

    <script src="../eventos.js"></script>
    <script>
        const botonVer = document.getElementById("ver-password");
        const inputPass = document.getElementById("password");
        botonVer.addEventListener("click", () => {
            const visible = inputPass.type === "text";
            inputPass.type = visible ? "password" : "text";
            botonVer.textContent = visible ? "ver" : "ocultar";
            botonVer.setAttribute("aria-pressed", String(!visible));
            botonVer.setAttribute("aria-label", visible ? "Mostrar contraseña" : "Ocultar contraseña");
        });
    </script>
</body>

</html>
