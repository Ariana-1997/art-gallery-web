                    data-bs-target="#menuOtay" aria-controls="menuOtay" aria-expanded="false"

                    <span class="navbar-toggler-icon"></span>

                <div class="collapse navbar-collapse" id="menuOtay">

    <main class="container my-5 reportes" style="max-width:1200px">
    <h1 class="h3 mb-4">Reporte de ventas 2026</h1>

    <!-- KPIs: el JS los llena solos -->
    <div id="kpis-reporte"></div>

    <div class="reportes-grid">
        <section class="reporte-tarjeta">
            <h2>Productos más vendidos</h2>
            <div class="grafico-caja">
                <canvas id="GraficoBarras"></canvas>
            </div>
        </section>

        <section class="reporte-tarjeta">
            <h2>Producto estrella por mes</h2>
            <div class="grafico-caja">
                <canvas id="GraficoBarras1"></canvas>
            </div>
        </section>

        <section class="reporte-tarjeta reporte-ancho">
            <h2>Evolución de ingresos mensuales (S/)</h2>
            <div class="grafico-caja">
                <canvas id="GraficoLineas"></canvas>
            </div>
        </section>

        <section class="reporte-tarjeta reporte-ancho">
            <h2>Ventas por categoría</h2>
            <div class="grafico-caja">
                <canvas id="GraficoCategorias"></canvas>
            </div>
        </section>
    </div>
</main>

    <br>
